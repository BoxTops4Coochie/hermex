# Personal sideload build for Hermex (private copy BoxTops4Coochie/hermex).
# Builds the HermesMobile scheme for a real arm64 device with the personal
# bundle id, then uploads an UNSIGNED .ipa. Sideloadly (Windows PC .96)
# re-signs with a free personal-team Apple ID — no certs in CI.
#
# Identity override uses the repo's contributor mechanism: Config/Shared.xcconfig
# ends with #include? "Local.xcconfig", so writing Local.xcconfig overrides
# everything without touching project.pbxproj.

name: Sideload Build

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier to build with"
        required: false
        default: "com.aabduh.hermex"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned device .ipa
    # Must match the repo's own CI (macos-26 / Xcode 26): the app relies on
    # Xcode 26 @Observable macro isolation; older Xcode fails with Swift
    # concurrency errors.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      BUNDLE_ID: ${{ inputs.bundle_id || 'com.aabduh.hermex' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write personal signing overrides
        run: |
          cat > Config/Local.xcconfig <<EOF
          DEVELOPMENT_TEAM =
          CODE_SIGN_IDENTITY = -
          APP_BUNDLE_IDENTIFIER = ${BUNDLE_ID}
          APP_GROUP_IDENTIFIER = group.${BUNDLE_ID}
          EOF
          cat Config/Local.xcconfig

      - name: Build Release for arm64 device (ad-hoc signed, entitlements embedded)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES

      - name: Verify app-group entitlements are embedded
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Entitlements of $(basename "${APP}"):"
          codesign -d --entitlements - "${APP}" 2>/dev/null
          codesign -d --entitlements - "${APP}" 2>/dev/null | grep -q "com.apple.security.application-groups"
          echo "App group entitlements: PRESENT"
          WIDGET=$(find "${APP}/PlugIns" -name "*.appex" | head -1)
          codesign -d --entitlements - "${WIDGET}" 2>/dev/null | grep -q "com.apple.security.application-groups"
          echo "Widget app group entitlements: PRESENT"

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Packaging ${APP}"
          test -n "${APP}"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "${APP}" ipa/Payload/
          # Info.plist bundle id sanity check
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            "ipa/Payload/$(basename "${APP}")/Info.plist"
          cd ipa
          zip -qry ../Hermex-unsigned.ipa Payload
          cd ..
          ls -la Hermex-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermex-unsigned-ipa
          path: Hermex-unsigned.ipa
          retention-days: 14
