# Personal sideload build for Hermex (private copy BoxTops4Coochie/hermex).
# Builds the HermesMobile scheme for a real arm64 device with the personal
# bundle id, then uploads an UNSIGNED .ipa. Sideloadly (Windows PC .96)
# re-signs with a free personal-team Apple ID — no certs in CI.
#
# Identity override uses the repo's contributor mechanism: Config/Shared.xcconfig
# ends with #include? "Local.xcconfig", so writing Local.xcconfig overrides
# everything without touching project.pbxproj.

name: Sideload Build

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier to build with"
        required: false
        default: "com.aabduh.hermex"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned device .ipa
    # Must match the repo's own CI (macos-26 / Xcode 26): the app relies on
    # Xcode 26 @Observable macro isolation; older Xcode fails with Swift
    # concurrency errors.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      BUNDLE_ID: ${{ inputs.bundle_id || 'com.aabduh.hermex' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write personal signing overrides
        run: |
          cat > Config/Local.xcconfig <<EOF
          DEVELOPMENT_TEAM =
          CODE_SIGN_IDENTITY = -
          APP_BUNDLE_IDENTIFIER = ${BUNDLE_ID}
          APP_GROUP_IDENTIFIER = group.${BUNDLE_ID}.QBUZU9NJHQ.QBUZU9NJHQ.QBUZU9NJHQ
          EOF
          cat Config/Local.xcconfig

      - name: Build Release for arm64 device (unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Embed app-group entitlements (ldid)
        # iOS SDK forbids ad-hoc ("-" identity) signing for device builds, so
        # the build stays unsigned and ldid embeds the entitlements blob into
        # each Mach-O with a pseudo-signature. Sideloadly's re-sign preserves
        # embedded entitlements -> the app group survives and the widget can
        # read the shared container.
        run: |
          set -euo pipefail
          brew install ldid
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          ENT=$(mktemp /tmp/ent.XXXXXX.plist)
          cat > "${ENT}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.${BUNDLE_ID}</string>
            </array>
            <key>com.apple.developer.team-identifier</key>
            <string></string>
          </dict>
          </plist>
          EOF
          sign_bundle() {
            local bundle="$1"
            local exe
            exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "${bundle}/Info.plist")
            ldid -S"${ENT}" "${bundle}/${exe}"
            echo "Entitlements embedded in ${bundle}/${exe}:"
            ldid -e "${bundle}/${exe}"
            ldid -e "${bundle}/${exe}" | grep -q "com.apple.security.application-groups"
          }
          sign_bundle "${APP}"
          for APPX in "${APP}"/PlugIns/*.appex; do
            sign_bundle "${APPX}"
          done
          echo "App-group entitlements: PRESENT in app and all extensions"

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Packaging ${APP}"
          test -n "${APP}"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "${APP}" ipa/Payload/
          # Info.plist bundle id sanity check
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            "ipa/Payload/$(basename "${APP}")/Info.plist"
          cd ipa
          zip -qry ../Hermex-unsigned.ipa Payload
          cd ..
          ls -la Hermex-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: Hermex-unsigned-ipa
          path: Hermex-unsigned.ipa
          retention-days: 14
